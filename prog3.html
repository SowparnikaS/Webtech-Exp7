
<!DOCTYPE html>
<html>
<head>
    <title>Car Workshop</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .car-area {
            position: relative;
            width: 350px;
            height: 200px;
            margin: 40px auto;
        }

        .roof {
            position: absolute;
            top: 35px;
            left: 105px;
            width: 140px;
            height: 55px;
            background: green;
            clip-path: polygon(25% 0, 75% 0, 100% 100%, 0 100%);
        }

        .glass {
            position: absolute;
            top: 48px;
            left: 135px;
            width: 80px;
            height: 35px;
            background: lightblue;
            clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
        }

        .body {
            position: absolute;
            top: 85px;
            left: 55px;
            width: 240px;
            height: 45px;
            background: #70e000;
            border-radius: 5px;
        }

        .wheel {
            position: absolute;
            top: 120px;
            width: 40px;
            height: 40px;
            background: #111c49;
            border-radius: 50%;
            transition: all 0.3s;
        }

        .wheel1 {
            left: 85px;
        }

        .wheel2 {
            left: 220px;
        }

        button {
            padding: 8px;
            margin: 5px;
            background: white;
            border: 1px solid #8ba5d9;
            cursor: pointer;
        }

        button:hover {
            background: lightblue;
        }
    </style>
</head>

<body>
    <h2>1. Car Workshop</h2>

    <div class="car-area">
        <div class="roof"></div>
        <div class="glass"></div>
        <div class="body"></div>
        <div class="wheel wheel1"></div>
        <div class="wheel wheel2"></div>
    </div>

    <button id="color">Change Body Color</button>
    <button id="glass">Change Glass Tint</button>
    <button id="increase">Tyre Size Increase</button>
    <button id="decrease">Tyre Size Decrease</button>
    <button id="reset">Reset</button>

    <script>
        $(document).ready(function () {
            var colors = ["red", "blue", "orange", "purple", "yellow"];
            var tints = ["lightblue", "black", "gray", "pink", "white"];

            var colorIndex = 0;
            var tintIndex = 0;
            var tyreSize = 40;

            $("#color").click(function () {
                colorIndex = (colorIndex + 1) % colors.length;

                $(".body").css("background-color", colors[colorIndex]);
                $(".roof").css("background-color", colors[colorIndex]);
            });

            $("#glass").click(function () {
                tintIndex = (tintIndex + 1) % tints.length;

                $(".glass").css("background-color", tints[tintIndex]);
            });

            $("#increase").click(function () {
                if (tyreSize < 70) {
                    tyreSize += 5;

                    $(".wheel").css({
                        "width": tyreSize + "px",
                        "height": tyreSize + "px"
                    });
                }
            });

            $("#decrease").click(function () {
                if (tyreSize > 20) {
                    tyreSize -= 5;

                    $(".wheel").css({
                        "width": tyreSize + "px",
                        "height": tyreSize + "px"
                    });
                }
            });

            $("#reset").click(function () {
                colorIndex = 0;
                tintIndex = 0;
                tyreSize = 40;

                $(".body").css("background-color", "#70e000");
                $(".roof").css("background-color", "green");
                $(".glass").css("background-color", "lightblue");

                $(".wheel").css({
                    "width": "40px",
                    "height": "40px"
                });
            });
        });
    </script>
</body>
</html>
